name: ci

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify unit and dual-store integration contracts
        run: ./mvnw -B -ntp verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java-test-reports
          path: target/surefire-reports/

  e2e-mongo:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run MongoDB API and browser E2E contracts
        run: npm run e2e:mongo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-mongo
          path: playwright-report/

  e2e-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run Oracle API and browser E2E contracts
        run: npm run e2e:oracle
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-oracle
          path: playwright-report/
