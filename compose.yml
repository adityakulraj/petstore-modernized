name: petstore-modernized

x-app-common: &app-common
  build:
    context: .
  environment:
    DEMO_USERNAME: ${DEMO_USERNAME:-alice}
    DEMO_PASSWORD: ${DEMO_PASSWORD:-petstore-demo}
  healthcheck:
    test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health/readiness"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 20s

services:
  oracle:
    image: gvenzl/oracle-free:23.26.2-slim-faststart
    profiles: ["oracle"]
    environment:
      ORACLE_PASSWORD: ${ORACLE_ADMIN_PASSWORD:-oracle_local_admin}
      APP_USER: ${ORACLE_USERNAME:-petstore}
      APP_USER_PASSWORD: ${ORACLE_PASSWORD:-petstore_local_only}
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  mongo:
    image: mongo:8.2.11
    profiles: ["mongo"]
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'try { rs.status().ok } catch (e) { rs.initiate({_id:\"rs0\",members:[{_id:0,host:\"mongo:27017\"}]}).ok }' | grep 1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  app-oracle:
    <<: *app-common
    profiles: ["oracle"]
    environment:
      APP_STORE: oracle
      ORACLE_URL: jdbc:oracle:thin:@oracle:1521/FREEPDB1
      ORACLE_USERNAME: ${ORACLE_USERNAME:-petstore}
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-petstore_local_only}
      DEMO_USERNAME: ${DEMO_USERNAME:-alice}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-petstore-demo}
    ports:
      - "8080:8080"
    depends_on:
      oracle:
        condition: service_healthy

  app-mongo:
    <<: *app-common
    profiles: ["mongo"]
    environment:
      APP_STORE: mongo
      MONGODB_URI: mongodb://mongo:27017/petstore?replicaSet=rs0
      DEMO_USERNAME: ${DEMO_USERNAME:-alice}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-petstore-demo}
    ports:
      - "8080:8080"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  oracle-data:
  mongo-data:
