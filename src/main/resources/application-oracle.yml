spring:
  config:
    activate:
      on-profile: oracle
  autoconfigure:
    exclude:
      - org.springframework.boot.mongodb.autoconfigure.MongoAutoConfiguration
      - org.springframework.boot.data.mongodb.autoconfigure.DataMongoAutoConfiguration
      - org.springframework.boot.data.mongodb.autoconfigure.DataMongoRepositoriesAutoConfiguration
  datasource:
    url: ${ORACLE_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
    username: ${ORACLE_USERNAME:petstore}
    password: ${ORACLE_PASSWORD:petstore_local_only}
    hikari:
      pool-name: petstore-oracle
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_SIZE:1}
      connection-timeout: ${DB_POOL_MAX_WAIT_MS:10000}
      idle-timeout: ${DB_POOL_MAX_IDLE_MS:300000}
      validation-timeout: 5000
      max-lifetime: 1800000
      keepalive-time: 120000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        order_inserts: true
        order_updates: true
