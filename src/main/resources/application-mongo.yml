spring:
  config:
    activate:
      on-profile: mongo
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
  mongodb:
    # Host-run default pins the single local member because its Docker replica-set name is not host-resolvable.
    uri: ${MONGODB_URI:mongodb://localhost:27017/petstore?replicaSet=rs0&directConnection=true}
  data:
    mongodb:
      auto-index-creation: true
