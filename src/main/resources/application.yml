spring:
  application:
    name: petstore-modernized
  profiles:
    active: ${APP_STORE:oracle}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

app:
  store: ${APP_STORE:oracle}
  demo:
    username: ${DEMO_USERNAME:alice}
    password: ${DEMO_PASSWORD:petstore-demo}
    additional-username: ${DEMO_ADDITIONAL_USERNAME:aditya}
    additional-password: ${DEMO_ADDITIONAL_PASSWORD:password}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin}
  database:
    pool:
      min-size: ${DB_POOL_MIN_SIZE:1}
      max-size: ${DB_POOL_MAX_SIZE:10}
      max-wait: ${DB_POOL_MAX_WAIT_MS:10000}ms
      max-idle: ${DB_POOL_MAX_IDLE_MS:300000}ms
    retry:
      max-attempts: ${DB_RETRY_MAX_ATTEMPTS:5}
      initial-delay: ${DB_RETRY_INITIAL_DELAY:25ms}
      max-delay: ${DB_RETRY_MAX_DELAY:500ms}

server:
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  file:
    name: ${LOG_FILE:logs/petstore.log}
  logback:
    rollingpolicy:
      max-file-size: ${LOG_MAX_FILE_SIZE:10MB}
      max-history: ${LOG_MAX_HISTORY:7}
  structured:
    format:
      # Logstash JSON includes MDC requestId/correlationId and SLF4J event key/value pairs.
      console: ${CONSOLE_LOG_STRUCTURED_FORMAT:logstash}
      file: logstash
  level:
    org.springframework.security: INFO
